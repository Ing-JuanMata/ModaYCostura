name: deploy
run-name: deploying api
on:
    workflow_dispatch:
    pull_request:
        types: [closed]
        branches: [main]
jobs:
    build-container:
        runs-on: self-hosted
        steps:
            - uses: actions/checkout@v4
            - name: build
              run: docker build -t ghcr.io/ing-juanmata/modaycostura:latest .
            - name: login to docker
              run: docker login --username ing-juanmata --password ${{secrets.GITHUB_TOKEN}}
            - name: push image
              run: docker push ghcr.io/ing-juanmata/modaycostura:latest
